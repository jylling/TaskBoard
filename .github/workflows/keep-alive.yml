name: Keep Supabase-projekter aktive

on:
  schedule:
    - cron: '0 6 */3 * *'   # kl. 06:00 UTC hver 3. dag – god margin ift. jeres 5-dages grænse
  workflow_dispatch:         # gør det muligt at trigge manuelt til test

permissions:
  contents: write            # nødvendig for keepalive-committet nedenfor

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping projekt 1
        run: |
          curl -sS "${{ secrets.SUPABASE_URL_1 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_1 }}" \
            -o /dev/null -w "Projekt 1 svarede: %{http_code}\n"

      - name: Ping projekt 2
        run: |
          curl -sS "${{ secrets.SUPABASE_URL_2 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_2 }}" \
            -o /dev/null -w "Projekt 2 svarede: %{http_code}\n"

      - name: Hold selve repo'et aktivt (undgå GitHubs 60-dages auto-disable)
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-run.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git add .keepalive/last-run.txt
          git diff --cached --quiet || git commit -m "chore: keepalive ping $(date -u +%F)"
          git push
